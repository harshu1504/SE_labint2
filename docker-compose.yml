services:

  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "8086:80"
    volumes:
      - ./nginx.html:/usr/share/nginx/html/index.html:ro

  apache:
    image: httpd:latest
    container_name: apache-container
    ports:
      - "8087:80"
    volumes:
      - ./apache.html:/usr/local/apache2/htdocs/index.html:ro